name: CI/CD Pipeline - API-TurnOS

# El pipeline se ejecutará cada vez que hagas un push a la rama main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código de tu repositorio en la máquina virtual
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Instala Node.js para poder correr la aplicación
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Utilizamos una versión estable de Node
        cache: 'npm'

    # 3. Instala las dependencias (Express, Cucumber, TypeScript, etc.)
    - name: Instalar dependencias
      run: npm install

    # 4. Ejecuta tu suite de pruebas BDD con Cucumber
    - name: Ejecutar pruebas (Fase Verde XP)
      run: npm test