name: CI/CD Pipeline - API-TurnOS

# El pipeline se ejecutará cada vez que hagas un push a la rama main o master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código de tu repositorio en la máquina virtual
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Instala Node.js para poder correr la aplicación
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # Utilizamos una versión estable de Node
        cache: 'npm'

    # 3. Instala las dependencias (Express, Cucumber, Prisma, etc.)
    - name: Instalar dependencias
      run: npm install

    # 4. Levantar la base de datos usando el archivo docker-compose.yml de tu repo
    - name: Iniciar base de datos
      run: docker compose up -d

    # 5. Darle unos segundos a PostgreSQL para que termine de inicializarse
    - name: Esperar a la base de datos
      run: sleep 5

    # 6. Aplicar el esquema de Prisma a la base de datos temporal de GitHub Actions
    - name: Ejecutar migraciones de Prisma
      run: npx prisma migrate deploy
      env:
        # Asegúrate de que esto coincida con lo que tienes en tu docker-compose.yml
        DATABASE_URL: "postgresql://usuario:password123@localhost:5432/turnos_db?schema=public"

    # 7. Ejecuta tu suite de pruebas BDD con Cucumber
    - name: Ejecutar pruebas (Fase Verde XP)
      run: npm test
      env:
        # Los tests necesitan la variable para conectarse a la DB levantada
        DATABASE_URL: "postgresql://usuario:password123@localhost:5432/turnos_db?schema=public"